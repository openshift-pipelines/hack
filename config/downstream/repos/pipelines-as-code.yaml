repo: pac-downstream
upstream: tektoncd/pipelines-as-code
components:
  - name: controller
  - name: webhook
  - name: watcher
  - name: cli
# TODO : Please remove this patch once we have 1.27 base image available here
# registry.access.redhat.com/ubi9/go-toolset
patches:
  - name: patch-golang-gomod-1
    script: |
      sed -i "s/go 1.27.3/go 1.26.10/g" go.mod
  - name: patch-golang-gomod-2
    script: |
      sed -i "s/go 1.27.1/go 1.26.10/g" go.mod
  - name: patch-golang-vendor
    script: |
      sed -i "s/go 1.27.0/go 1.26.10/g" vendor/modules.txt
