name: tektoncd-pipeline
upstream: tektoncd/pipeline
no-prefix-upstream: true
components:
  - name: controller
  - name: entrypoint
  - name: events
  - name: nop
  - name: resolvers
    tekton:
      watched-sources: ("dependencies/tini/***".pathChanged() || "upstream/***".pathChanged() || ".konflux/patches/***".pathChanged() || ".konflux/rpms/***".pathChanged() )
  - name: sidecarlogresults
  - name: webhook
  - name: workingdirinit
# TODO : Please remove this patch once we have 1.27 base image available here
# registry.access.redhat.com/ubi9/go-toolset
patches:
  - name: patch-golang-gomod
    script: |
      sed -i "s/go 1.27.3/go 1.26.10/g" go.mod
  - name: patch-golang-vendor
    script: |
      sed -i "s/go 1.27.0/go 1.26.10/g" vendor/modules.txt
