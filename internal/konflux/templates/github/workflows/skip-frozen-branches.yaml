{{ define "skip-frozen-branches" -}}
{{- if .FrozenBranches }}
          frozen='{{ join " " .FrozenBranches }}'
          echo "Skipping frozen branches: $frozen"
          filtered=""
          while read -r b; do
            [ -z "$b" ] && continue
            skip=false
            for f in $frozen; do
              if [ "$b" = "$f" ]; then skip=true; break; fi
            done
            if [ "$skip" = false ]; then
              filtered="${filtered}${b}"$'\n'
            fi
          done <<< "$branches"
          branches=$(printf '%s' "$filtered")
          echo "Branches after freeze filter:"
          echo "$branches"
{{- end }}
{{- end }}
