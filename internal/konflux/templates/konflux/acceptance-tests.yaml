---
apiVersion: appstudio.redhat.com/v1beta2
kind: IntegrationTestScenario
metadata:
  labels:
    test.appstudio.openshift.io/optional: "true"
  name: {{hyphenize .Name}}-{{hyphenize .Release.Version}}-acceptance-tests-{{hyphenize .InstanceArch}}
spec:
  application: {{hyphenize .Name}}-{{hyphenize .Release.Version}}
  contexts:
    - description: execute the integration test for a Snapshot created for a `push` event
      name: push
  params:
    - name: INSTANCE_TYPE
      value: {{.InstanceType}}
{{- if eq .Release.Version "1.23" }}
    - name: GIT_RELEASE_TESTS_BRANCH
      value: release-v{{ .Release.Version }}
{{- end }}
  resolverRef:
    params:
      - name: url
        value: https://github.com/openshift-pipelines/operator
      - name: revision
        value: main
      - name: pathInRepo
        value: .konflux/tekton/acceptance-test{{ if ne .Release.Version "1.23" }}-ginkgo{{ end }}-pipeline.yaml
    resolver: git
