name: merge-hack-pull-requests

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  repository-projects: write

jobs:
  bulk-merge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Process All Repos
        env:
          GH_TOKEN: ${{ secrets.OPENSHIFT_PIPELINES_ROBOT }}
          ORG_NAME: "openshift-pipelines"
          TARGET_LABEL: "hack"
        run: |
          echo "Getting repository list..."

          REPOS=$(yq -N e 'env(ORG_NAME) + "/" + (.repo // .name)' config/downstream/repos/*.yaml; echo "$ORG_NAME/hack" | sort -u)

          # Collect release branches with code-freeze enabled (e.g. release-v1.24.x)
          FROZEN_BRANCHES=""
          for f in config/downstream/releases/*.yaml; do
            if [ "$(yq e '."code-freeze" // false' "$f")" = "true" ]; then
              version=$(yq e '.version' "$f")
              if [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then
                FROZEN_BRANCHES="$FROZEN_BRANCHES release-v${version}.x"
              else
                FROZEN_BRANCHES="$FROZEN_BRANCHES $version"
              fi
            fi
          done
          echo "Frozen branches:$FROZEN_BRANCHES"

          for REPO in $REPOS; do
            echo "Searching $REPO for PRs with label: $TARGET_LABEL"

            PRS=$(gh pr list -R "$REPO" --label "$TARGET_LABEL" --json number,baseRefName,labels --jq '.[] | "\(.number) \(.baseRefName) \([(.labels // [])[].name] | join(","))"')

            if [[ -z "$PRS" ]]; then
              echo "No PRs found in $REPO"
              continue
            fi

            while read -r p base labels; do
              if [[ " $FROZEN_BRANCHES " == *" $base "* ]]; then
                echo "Skipping PR #$p in $REPO (base $base is code-frozen)"
                continue
              fi
              if [[ ",$labels," == *",hold,"* || ",$labels," == *",do-not-merge/hold,"* ]]; then
                echo "Skipping PR #$p in $REPO (hold label present)"
                continue
              fi
              echo "Attempting to merge PR #$p in $REPO..."
              gh pr edit $p -R "$REPO" --add-label "lgtm" --add-label "approved" || true
              gh pr merge "$p" -R "$REPO" --rebase --auto || true
            done <<< "$PRS"
          done
