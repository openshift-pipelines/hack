---
name: Generate konflux configurations

on:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - 'main'
  workflow_dispatch: # Manual workflow trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
      - id: set-matrix
        name: set-matrix
        run: |
          # A release under code-freeze is excluded from the matrix entirely, so no
          # konflux config is regenerated for it. The freeze is lifted through the
          # release-code-freeze workflow, which is deliberately not gated on this.
          SKIPPED=()
          ACTIVE=()
          for f in config/downstream/releases/*.yaml; do
            version=$(basename "$f" .yaml)
            if [[ "$(yq e '.code-freeze // false' "$f")" == "true" ]]; then
              SKIPPED+=("$version")
              continue
            fi
            ACTIVE+=("$version")
          done

          VERSIONS=$(printf '%s\n' "${ACTIVE[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0)) + ["main"]')
          echo "Versions: ${VERSIONS}"
          echo "versions=${VERSIONS}" >> $GITHUB_OUTPUT

          {
            echo "## Generate konflux configurations"
            echo ""
            echo "**Generating for:** ${ACTIVE[*]:-(none)} main"
            if [[ ${#SKIPPED[@]} -gt 0 ]]; then
              echo ""
              echo "**Skipped (code-freeze):** ${SKIPPED[*]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
    outputs:
      versions: ${{ steps.set-matrix.outputs.versions }}
  update-projects:
    needs: build-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.build-matrix.outputs.versions) }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.x
      - name: login
        env:
          GH_TOKEN: ${{ secrets.OPENSHIFT_PIPELINES_ROBOT }}
        if: github.event_name != 'pull_request'
        run: |
          git config user.name openshift-pipelines-bot
          git config user.email pipelines-extcomm@redhat.com
          gh auth status
          gh auth setup-git

      - name: Generate  ${{matrix.version}} configurations and pull-requests
        run: |
          echo "Let's go"
          go run ./cmd/konflux/ --version ${{ matrix.version }} --dry-run=${{ github.event_name == 'pull_request'}}

        env:
          GH_TOKEN: ${{ secrets.OPENSHIFT_PIPELINES_ROBOT }}
          GITHUB_TOKEN: ${{ secrets.OPENSHIFT_PIPELINES_ROBOT }}
      - name: Commit new changes
        if: github.event_name != 'pull_request'
        run: |
          git config user.name openshift-pipelines-bot
          git config user.email pipelines-extcomm@redhat.com
          
          BASE_BRANCH=${GITHUB_REF#refs/heads/}
          SOURCE_BRANCH=actions/update/hack-update-konflux-${BASE_BRANCH}-${{matrix.version}}
          git checkout -b ${SOURCE_BRANCH}
          git add -f .konflux
          
          if [[ -z $(git status --porcelain --untracked-files=no) ]]; then
            echo "No change, exiting"
            exit 0
          fi
          
          git commit -F- <<EOF
            [bot:${{matrix.version}}] Update Generated Konflux Config
          EOF
          
          git push -f origin ${SOURCE_BRANCH}
          
          if [ "$(gh pr list --base ${BASE_BRANCH} --head ${SOURCE_BRANCH} --json url --jq 'length')" = "0" ]; then
            echo "creating PR..."
            gh pr create -B ${BASE_BRANCH} -H ${SOURCE_BRANCH} --label=automated --label=hack   --fill
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
