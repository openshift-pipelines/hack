name: Release Action - Code Freeze
run-name: ${{ inputs.action }} code-freeze for ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Set or lift code-freeze for a versioned release branch'
        required: true
        type: choice
        options:
          - freeze
          - unfreeze
      version:
        description: 'Downstream release version (e.g. "1.23", "1.24"). next and nightly are not allowed.'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  toggle-code-freeze:
    runs-on: ubuntu-latest
    env:
      ACTION: ${{ inputs.action }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install yq
        run: |
          YQ_VERSION="v4.52.4"
          YQ_SHA256="0c4d965ea944b64b8fddaf7f27779ee3034e5693263786506ccd1c120f184e8c"
          wget -q "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -O /tmp/yq
          echo "$YQ_SHA256  /tmp/yq" | sha256sum --check --strict
          sudo mv /tmp/yq /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Update release config
        id: update
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: version must be X.Y (e.g. 1.23, 1.24). next, nightly, and other names are not allowed."
            exit 1
          fi

          RELEASE_YAML="config/downstream/releases/${VERSION}.yaml"
          if [[ ! -f "$RELEASE_YAML" ]]; then
            echo "ERROR: release config not found: $RELEASE_YAML"
            exit 1
          fi

          if [[ "$ACTION" == "freeze" ]]; then
            TARGET=true
            TITLE="Set code freeze for ${VERSION}"
          else
            TARGET=false
            TITLE="Remove code freeze for ${VERSION}"
          fi

          CURRENT=$(yq e '.code-freeze // false' "$RELEASE_YAML")
          echo "Current code-freeze=${CURRENT} in ${RELEASE_YAML}"
          if [[ "$CURRENT" == "$TARGET" ]]; then
            echo "code-freeze is already ${TARGET}. Nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          yq -i e ".code-freeze = ${TARGET}" "$RELEASE_YAML"
          echo "Set code-freeze=${TARGET} in ${RELEASE_YAML}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        id: create_pr
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ steps.update.outputs.title }}
        run: |
          set -euo pipefail
          git config user.name openshift-pipelines-bot
          git config user.email pipelines-extcomm@redhat.com

          BASE_BRANCH=${GITHUB_REF#refs/heads/}
          SOURCE_BRANCH=actions/${BASE_BRANCH}/code-freeze-${ACTION}-${VERSION}

          git checkout -b "${SOURCE_BRANCH}"
          git add -f "config/downstream/releases/${VERSION}.yaml"

          git commit -F- <<EOF
            [bot: ${VERSION}] ${TITLE}

            Generated by workflow [${GITHUB_WORKFLOW}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
            Triggered by ${GITHUB_TRIGGERING_ACTOR}
          EOF

          git push -f origin "${SOURCE_BRANCH}"

          if [ "$(gh pr list --base "${BASE_BRANCH}" --head "${SOURCE_BRANCH}" --json url --jq 'length')" = "0" ]; then
            PR_URL=$(gh pr create -B "${BASE_BRANCH}" -H "${SOURCE_BRANCH}" --label=automated --title "[bot:${VERSION}] ${TITLE}" --body "$(cat <<EOF
          ## Summary
          - ${TITLE} in \`config/downstream/releases/${VERSION}.yaml\`

          Generated by [${GITHUB_WORKFLOW}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          Triggered by ${GITHUB_TRIGGERING_ACTOR}

          After merge, generate-konflux will apply freeze/unfreeze to the \`release-v${VERSION}.x\` branch.
          EOF
          )")
            echo "url=${PR_URL}" >> "$GITHUB_OUTPUT"
          else
            echo "PR already exists for ${SOURCE_BRANCH}"
            PR_URL=$(gh pr list --base "${BASE_BRANCH}" --head "${SOURCE_BRANCH}" --json url --jq '.[0].url')
            echo "url=${PR_URL}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Summary
        env:
          PR_URL: ${{ steps.create_pr.outputs.url }}
          TITLE: ${{ steps.update.outputs.title }}
        run: |
          {
            echo "## ${TITLE:-Code freeze}"
            echo ""
            echo "**Version:** ${VERSION} | **Action:** ${ACTION}"
            echo ""
            if [[ -n "${PR_URL}" ]]; then
              echo "Opened Pull Request: ${PR_URL}"
            else
              echo "No change; no PR generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
