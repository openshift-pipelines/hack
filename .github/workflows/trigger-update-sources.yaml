name: Trigger Update Sources

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Downstream release version (e.g. "1.24", "next", "nightly")'
        required: true
        type: string
      repo:
        description: 'Specific repo name to target (leave empty for all downstream repos)'
        required: false
        type: string
        default: ''

concurrency:
  group: trigger-update-sources-${{ inputs.version }}-${{ inputs.repo }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trigger-update-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hack repo
        uses: actions/checkout@v6

      - name: Install yq
        run: |
          YQ_VERSION="v4.52.4"
          YQ_SHA256="0c4d965ea944b64b8fddaf7f27779ee3034e5693263786506ccd1c120f184e8c"
          wget -q "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -O /tmp/yq
          echo "$YQ_SHA256  /tmp/yq" | sha256sum --check --strict
          sudo mv /tmp/yq /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Trigger update-sources workflows
        env:
          GH_TOKEN: ${{ secrets.OPENSHIFT_PIPELINES_ROBOT }}
          VERSION: ${{ inputs.version }}
          TARGET_REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail

          # Validate version format
          if [[ ! "$VERSION" =~ ^(next|nightly|[0-9]+\.[0-9]+)$ ]]; then
            echo "ERROR: Invalid version format '$VERSION'. Expected 'next', or 'nightly' or 'X.Y' (e.g., '1.22')"
            exit 1
          fi

          if [[ "$VERSION" == "next" || "$VERSION" == "nightly" ]]; then
            BRANCH=$VERSION
          else
            BRANCH="release-v${VERSION}.x"
          fi
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          ORG="openshift-pipelines"
          WORKFLOW_FILE="update-sources.yaml"
          WORKFLOW_PATH=".github/workflows/${WORKFLOW_FILE}"
          RELEASE_FILE="config/downstream/releases/${VERSION}.yaml"

          if [[ ! -f "$RELEASE_FILE" ]]; then
            echo "ERROR: release config not found: $RELEASE_FILE"
            exit 1
          fi

          # code-freeze is set in each config/downstream/releases/<version>.yaml
          CODE_FREEZE=$(yq e '.code-freeze' "$RELEASE_FILE")
          if [[ "$CODE_FREEZE" == "true" ]]; then
            echo "Code freeze is set for version ${VERSION} in ${RELEASE_FILE}. Not triggering update-sources."
            {
              echo "## Trigger Update Sources"
              echo ""
              echo "**Version:** ${VERSION} | **Branch:** ${BRANCH} | **Timestamp:** ${TIMESTAMP}"
              echo ""
              echo "Code freeze is set for version ${VERSION}. update-sources was not triggered."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Triggering ${WORKFLOW_FILE} on branch: $BRANCH"
          echo "Timestamp: $TIMESTAMP"
          echo "---"

          REPOS=$(yq -N e '.repo // .name' config/downstream/repos/*.yaml | sort -u)

          TOTAL=0
          OK=0
          SKIPPED=0
          FAILED=0
          RESULTS=""

          for REPO in $REPOS; do
            if [[ -n "$TARGET_REPO" ]] && [[ "$REPO" != "$TARGET_REPO" ]]; then
              continue
            fi

            TOTAL=$((TOTAL + 1))
            FULL_REPO="$ORG/$REPO"

            if ! gh api "repos/$FULL_REPO/branches/$BRANCH" --silent 2>/dev/null; then
              echo "SKIP $REPO: branch $BRANCH not found"
              RESULTS="${RESULTS}| ${REPO} | ${BRANCH} | Skipped (no branch) | - |\n"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            if ! gh api "repos/$FULL_REPO/contents/${WORKFLOW_PATH}?ref=$BRANCH" --silent 2>/dev/null; then
              echo "SKIP $REPO: ${WORKFLOW_PATH} not found on $BRANCH"
              RESULTS="${RESULTS}| ${REPO} | ${BRANCH} | Skipped (no workflow) | - |\n"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            if ! gh workflow run "$WORKFLOW_FILE" --ref "$BRANCH" --repo "$FULL_REPO"; then
              echo "FAILED $REPO ($BRANCH)"
              RESULTS="${RESULTS}| ${REPO} | ${BRANCH} | Failed | - |\n"
              FAILED=$((FAILED + 1))
              continue
            fi

            RUN_URL="https://github.com/${FULL_REPO}/actions/workflows/${WORKFLOW_FILE}?query=branch%3A${BRANCH}"
            echo "OK $REPO ($BRANCH)"
            RESULTS="${RESULTS}| [${REPO}](${RUN_URL}) | ${BRANCH} | Triggered | [view](${RUN_URL}) |\n"
            OK=$((OK + 1))
          done

          # Detect repo name typos
          if [[ -n "$TARGET_REPO" ]] && [[ $TOTAL -eq 0 ]]; then
            echo "ERROR: repo '$TARGET_REPO' not found in config/downstream/repos/*.yaml"
            echo "Available repos:"
            echo "$REPOS"
            exit 1
          fi

          echo "---"
          echo "Summary: $TOTAL targets processed, $OK triggered, $SKIPPED skipped, $FAILED failed"

          {
            echo "## Trigger Update Sources"
            echo ""
            echo "**Version:** ${VERSION} | **Branch:** ${BRANCH} | **Timestamp:** ${TIMESTAMP} | **Workflow:** ${WORKFLOW_FILE}"
            echo ""
            echo "Dispatches \`${WORKFLOW_FILE}\` on each target branch. That workflow opens or updates the upstream-sync pull request; it does not wait for the run to finish."
            echo ""
            echo "| Repo | Branch | Status | Run |"
            echo "|------|--------|--------|-----|"
            echo -e "$RESULTS"
            echo ""
            echo "**Total:** ${TOTAL} | **Triggered:** ${OK} | **Skipped:** ${SKIPPED} | **Failed:** ${FAILED}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ $FAILED -gt 0 ]]; then
            exit 1
          fi
